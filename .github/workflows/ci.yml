name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify
        run: corepack pnpm run verify

      # What verify built is what gets deployed
      - name: Keep the build for the deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ulrich.green: a Cloudflare Worker serving dist/ (wrangler.jsonc), from main once verify passes. The
  # token is only in this job, and only in its last step. The job installs none of the site's
  # dependencies, only wrangler, from deploy/pnpm-lock.yaml, which pins its whole tree by hash, and with
  # no install scripts, in a step without the token. So the only code that sees the token is wrangler's
  # pinned tree.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install wrangler
        run: pnpm install --dir deploy --frozen-lockfile --ignore-workspace --ignore-scripts

      - name: Get the build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Until ~/.dotfiles/infra turns site_ci_deploys on, there's no token, and ulrich.green deploys
      # from the Mac: wrangler login, deploy, logout (deploy/node_modules/.bin/wrangler).
      # Deploys run one at a time, but in the order their verify jobs finished, and an old run can be
      # re-run: so only main's tip deploys. A newer push's own run deploys that one if it passes.
      - name: Deploy to Cloudflare
        run: |
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::Not deployed: main has moved on to ${tip:0:7}, and its own run deploys it"
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Not deployed: this repo has no Cloudflare token yet, so ulrich.green deploys from the Mac"
            exit 0
          fi
          deploy/node_modules/.bin/wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
